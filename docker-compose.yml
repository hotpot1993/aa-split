name: aa-split

services:
  postgres:
    image: postgres:16-alpine
    container_name: aa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aa_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-aa_split}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aa} -d ${POSTGRES_DB:-aa_split}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: aa-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: aa-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-aa-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-aa_minio_dev_password}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web 控制台
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 一键创建 MinIO bucket（依赖 minio 健康后执行一次）
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-aa-minio} ${MINIO_ROOT_PASSWORD:-aa_minio_dev_password} &&
      mc mb --ignore-existing local/${MINIO_BUCKET:-aa-receipts} &&
      echo 'bucket ready'
      "

  api:
    build: ./server
    container_name: aa-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-aa}:${POSTGRES_PASSWORD:-aa_dev_password}@postgres:5432/${POSTGRES_DB:-aa_split}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change_me_access_secret}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change_me_refresh_secret}
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-aa-minio}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-aa_minio_dev_password}
      MINIO_BUCKET: ${MINIO_BUCKET:-aa-receipts}
      MINIO_USE_SSL: "false"
      JPUSH_APP_KEY: ${JPUSH_APP_KEY:-}
      JPUSH_MASTER_SECRET: ${JPUSH_MASTER_SECRET:-}
      JPUSH_ENABLED: ${JPUSH_ENABLED:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-true}
      # 检查更新：最新版信息（App 内「检查更新」读取；发版时更新 .env + 上传 apk 到 Gitee 发行版 / nginx /apk/）
      # 发版 SOP：版本号同步升级 pubspec.yaml / config.dart / docs/ui-demo/index.html，
      # 打 v* 标签推 GitHub Actions 构建签名包，随后把 APK 传到 Gitee 发行版附件并更新此处 + .env
      APP_VERSION_LATEST: ${APP_VERSION_LATEST:-1.0.5}
      APP_VERSION_BUILD: ${APP_VERSION_BUILD:-2006}
      APP_VERSION_URL: "${APP_VERSION_URL:-https://gitee.com/hotpot1993/aa-split/releases/download/v1.0.5/aa-split-v1.0.5.apk}"
      APP_VERSION_NOTES: "${APP_VERSION_NOTES:-9 项界面与功能修复：账单编辑可换垫付人/改分摊、弹窗布局优化、修改安全问题、换头像同步成员列表、收款码卡片生成图片、设置迁入「我的」等}"
    ports:
      - "3000:3000"
    volumes:
      - uploads:/app/uploads   # 凭证文件持久化（容器重建不丢失）
    # 正式迁移（prisma/migrations 随镜像）；建库需先 migrate deploy
    command: sh -c "npx prisma migrate deploy && node dist/main.js"

volumes:
  pgdata:
  redisdata:
  miniodata:
  uploads:
