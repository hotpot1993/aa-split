name: Mirror to Gitee

# GitHub → Gitee 自动镜像同步：每次推送（任意分支/标签）后，
# 把全部 heads + tags 强制同步到 Gitee 镜像仓库 gitee.com/hotpot1993/aa-split
# （App 更新包默认从 Gitee 发行版拉取，镜像仓库保持与 GitHub 一致是发行前提）
on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mirror-gitee
  cancel-in-progress: false

jobs:
  mirror:
    name: Push branches & tags to Gitee
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 全量历史 + 全部标签：镜像需完整对象（Gitee 线上壳也靠历史换页）
          fetch-depth: 0
          fetch-tags: true

      - name: Mirror push to Gitee
        env:
          GITEE_USER: ${{ secrets.GITEE_USERNAME }}
          GITEE_TOKEN: ${{ secrets.GITEE_ACCESS_TOKEN }}
        run: |
          if [ -z "$GITEE_USER" ] || [ -z "$GITEE_TOKEN" ]; then
            echo "::error::Secrets GITEE_USERNAME / GITEE_ACCESS_TOKEN 未配置——请在仓库 Settings → Secrets and variables → Actions 添加后重跑本工作流"
            exit 1
          fi
          git config --global user.name "AA-Split Dev Mirror"
          git config --global user.email "dev@aasplit.local"
          git remote add gitee "https://${GITEE_USER}:${GITEE_TOKEN}@gitee.com/hotpot1993/aa-split.git"
          # 只同步 heads/tags（避免 refs/remotes/* 触发 Gitee 隐藏引用保护）；
          # Gitee 偶发 5xx：最多重试 3 次
          for i in 1 2 3; do
            if git push --force gitee 'refs/heads/*:refs/heads/*' 'refs/tags/*:refs/tags/*'; then
              echo "::notice::Gitee mirror synced OK (attempt $i)"
              exit 0
            fi
            echo "::warning::Gitee push failed (attempt $i/3), retrying in 15s..."
            sleep 15
          done
          echo "::error::Gitee push failed after 3 attempts"
          exit 1
