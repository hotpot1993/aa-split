name: aa_design
description: AA分账App 手绘风设计系统（SketchyBorder / PaperCard / StampBadge / DoodleAnimations / 吉祥物团团）
version: 0.1.0
publish_to: none

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  fonts:
    - family: ZCOOLKuaiLe
      fonts:
        - asset: assets/fonts/ZCOOLKuaiLe-Regular.ttf
    - family: LongCang
      fonts:
        - asset: assets/fonts/LongCang-Regular.ttf
    - family: ZhiMangXing
      fonts:
        - asset: assets/fonts/ZhiMangXing-Regular.ttf
    - family: Caveat
      fonts:
        - asset: assets/fonts/Caveat-VariableFont_wght.ttf
    # 标准风格字体（设置页切换：金额=JetBrains Mono，其余=Noto Sans SC）
    # 可变字体按常用字重重复注册，保证 fontWeight 正确映射到 wght 轴
    - family: NotoSansSC
      fonts:
        - asset: assets/fonts/NotoSansSC-Variable.ttf
          weight: 400
        - asset: assets/fonts/NotoSansSC-Variable.ttf
          weight: 500
        - asset: assets/fonts/NotoSansSC-Variable.ttf
          weight: 700
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Variable.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-Variable.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono-Variable.ttf
          weight: 700
