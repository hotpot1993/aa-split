name: Release to Gitee

# GitHub 发行版（Release）发布事件 → 自动同步到 Gitee 发行版。
# 引擎：release2gitee（hepengju/release2gitee v1.2.1，Rust CLI）：
#   - 幂等（已存在发行版跳过）、同步最近 5 个发行版、最近 3 个保留附件、
#     body 中 GitHub 下载地址自动替换为 Gitee、进度条
# 运行位置：**自托管 Runner（relay-cn）**——GitHub 托管 runner（美国）与 VPS（美国）
#   直连 Gitee 附件上传会被拦截挂起（实测 60s/300s 超时；release2gitee CLI 硬编码 60s 超时）；
#   中国网络节点上传 20MB 仅 ~4s。故在本机（中国网络）注册 relay-cn 标签的自托管 Runner。
# 规范：更新包文件名 = app-release.apk（AppConfig.giteeUpdateUrl / APP_VERSION_URL 均指向
#       https://gitee.com/hotpot1993/aa-split/releases/download/vX.Y.Z/app-release.apk）
# 凭据：GITEE_ACCESS_TOKEN（Gitee PAT）+ github.token（GitHub API 速率）
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-gitee
  cancel-in-progress: false

jobs:
  sync:
    name: Sync releases to Gitee (release2gitee @ CN relay)
    runs-on: [self-hosted, relay-cn]
    env:
      GITEE_ACCESS_TOKEN: ${{ secrets.GITEE_ACCESS_TOKEN }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Install release2gitee CLI (Windows)
        env:
          VER: v1.2.1
        shell: powershell
        run: |
          $zip = "$env:TEMP\release2gitee.zip"
          curl.exe -fsSL -o $zip "https://github.com/hepengju/release2gitee/releases/download/$env:VER/release2gitee-x86_64-pc-windows-msvc.zip"
          $dir = "$env:TEMP\release2gitee"
          if (Test-Path $dir) { Remove-Item $dir -Recurse -Force }
          Expand-Archive -Path $zip -DestinationPath $dir -Force
          & "$dir\release2gitee.exe" --help | Select-Object -First 5

      - name: Sync latest GitHub releases to Gitee
        shell: powershell
        run: |
          $dir = "$env:TEMP\release2gitee"
          $env:GITHUB_OWNER = "hotpot1993"
          $env:GITHUB_REPO = "aa-split"
          $env:GITEE_OWNER = "hotpot1993"
          $env:GITEE_REPO = "aa-split"
          $env:GITEE_TOKEN = $env:GITEE_ACCESS_TOKEN
          & "$dir\release2gitee.exe"
          if ($LASTEXITCODE -ne 0) { throw "release2gitee 同步失败 (exit $LASTEXITCODE)" }

      - name: Verify latest Gitee download URL
        shell: powershell
        run: |
          $rel = curl.exe -s -H "Authorization: Bearer $env:GITHUB_TOKEN" "https://api.github.com/repos/hotpot1993/aa-split/releases/latest" | ConvertFrom-Json
          $url = "https://gitee.com/hotpot1993/aa-split/releases/download/$($rel.tag_name)/app-release.apk"
          $code = (curl.exe -sIL -o NUL -w "%{http_code}" --max-time 60 $url | Select-Object -Last 1)
          Write-Host "check $url -> http=$code"
          if ($code -ne "200" -and $code -ne "302") { throw "Gitee 下载地址不可用: http=$code" }
          Write-Host "Gitee 发行版已同步：$url"
