name: aa-split

services:
  postgres:
    image: postgres:16-alpine
    container_name: aa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aa_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-aa_split}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aa} -d ${POSTGRES_DB:-aa_split}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: aa-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: aa-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-aa-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-aa_minio_dev_password}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web 控制台
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 一键创建 MinIO bucket（依赖 minio 健康后执行一次）
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-aa-minio} ${MINIO_ROOT_PASSWORD:-aa_minio_dev_password} &&
      mc mb --ignore-existing local/${MINIO_BUCKET:-aa-receipts} &&
      echo 'bucket ready'
      "

  api:
    build: ./server
    container_name: aa-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-aa}:${POSTGRES_PASSWORD:-aa_dev_password}@postgres:5432/${POSTGRES_DB:-aa_split}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change_me_access_secret}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change_me_refresh_secret}
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-aa-minio}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-aa_minio_dev_password}
      MINIO_BUCKET: ${MINIO_BUCKET:-aa-receipts}
      MINIO_USE_SSL: "false"
      JPUSH_APP_KEY: ${JPUSH_APP_KEY:-}
      JPUSH_MASTER_SECRET: ${JPUSH_MASTER_SECRET:-}
      JPUSH_ENABLED: ${JPUSH_ENABLED:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-true}
      # 检查更新：最新版信息（App 内「检查更新」读取；VPS 线上由同步脚本热切换 .env）
      # 更新流程：GitHub 发布新版本（打 v* 标签 → Actions 正式签名构建并发布 Release）→
      # VPS 定时任务（scripts/vps-sync-update.sh，cron 每 15 分钟）自动从 GitHub 拉取安装包
      # 到 VPS /apk/（nginx 静态托管）并同步更新本项 + .env 的 APP_VERSION_URL 指向 VPS
      APP_VERSION_LATEST: ${APP_VERSION_LATEST:-1.0.15}
      APP_VERSION_BUILD: ${APP_VERSION_BUILD:-5009}
      APP_VERSION_URL: "${APP_VERSION_URL:-https://api.hotpot1993.top/apk/aa-split-v1.0.15.apk}"
      APP_VERSION_NOTES: "${APP_VERSION_NOTES:-记一笔三项增强（小票缩略图大图查看 / OCR 自动选币 / 未填标题默认分类名）+ 小票凭证上限 1 张 + P 序号文案清理}"
      # 小票 OCR：识别服务地址（ocr-worker）
      OCR_WORKER_URL: ${OCR_WORKER_URL:-http://ocr-worker:8000}
    ports:
      - "3000:3000"
    volumes:
      - uploads:/app/uploads   # 凭证文件持久化（容器重建不丢失）
    # 正式迁移（prisma/migrations 随镜像）；建库需先 migrate deploy
    command: sh -c "npx prisma migrate deploy && node dist/main.js"

  # 小票 OCR 识别服务（RapidOCR PP-OCRv5 mobile；见 ocr-worker/）
  ocr-worker:
    build: ./ocr-worker
    container_name: aa-ocr-worker
    restart: unless-stopped
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redisdata:
  miniodata:
  uploads:
