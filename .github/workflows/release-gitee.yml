name: Release to Gitee

# GitHub 发行版（Release）发布事件 → 自动同步到 Gitee 发行版（附件 + 元数据）。
#
# 运行环境：自托管 Runner（relay-cn，本机 = 中国网络）—— 实测结论：
#   - Gitee 附件上传仅中国网络顺畅（本机 20MB 4s；GitHub 美国 runner 60s 超时、美国 VPS 300s 挂起）
#   - GitHub 发行版产物下载：中国网络下 curl（重试 + -C 续传）稳定（92MB 31s），
#     release2gitee CLI 的 reqwest 下载会断流、其上传被 60s 硬编码超时封死（均已实测日志证实）
#   故本工作流用 curl 完成「下载 → Gitee 建版/幂等替换附件」全链路（策略与 release2gitee 一致：
#   最新发行版带全量附件，原文件名 app-release.apk / app-release.aab / app-arm64-v8a-release.apk）。
#
# 规范：更新包文件名 = app-release.apk（AppConfig.giteeUpdateUrl / APP_VERSION_URL 均指向
#       https://gitee.com/hotpot1993/aa-split/releases/download/vX.Y.Z/app-release.apk）
# 凭据：GITEE_ACCESS_TOKEN（Gitee PAT）+ github.token（GitHub API 速率）
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-gitee
  cancel-in-progress: false

jobs:
  sync:
    name: Sync latest release to Gitee (CN relay)
    runs-on: [self-hosted, relay-cn]
    env:
      GITEE_ACCESS_TOKEN: ${{ secrets.GITEE_ACCESS_TOKEN }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Download release assets from GitHub (retry + resume)
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $rel = curl.exe -s -H "Authorization: Bearer $env:GITHUB_TOKEN" `
            "https://api.github.com/repos/hotpot1993/aa-split/releases/latest" | ConvertFrom-Json
          $TAG = $rel.tag_name
          Write-Host "syncing GitHub release $TAG -> Gitee"
          $dir = "$env:TEMP\r2g-$TAG"
          if (Test-Path $dir) { Remove-Item $dir -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          foreach ($f in @("app-release.apk", "app-arm64-v8a-release.apk", "app-release.aab")) {
            $url = "https://github.com/hotpot1993/aa-split/releases/download/$TAG/$f"
            for ($i = 1; $i -le 5; $i++) {
              curl.exe -fL --retry 4 --retry-delay 3 --retry-all-errors -C - `
                --max-time 1200 -o "$dir\$f" $url
              if ($LASTEXITCODE -eq 0 -and (Test-Path "$dir\$f")) { break }
              Write-Host "download retry $i for $f"
              Start-Sleep -Seconds 10
            }
            if (-not (Test-Path "$dir\$f")) { throw "下载失败: $f" }
          }
          Write-Host ("r2g release files: " + (Get-ChildItem $dir | ForEach-Object { "$($_.Name)($([math]::Round($_.Length/1MB,1))MB)" }) -join ", ")
          "TAG=$TAG" | Out-File -FilePath "$env:GITHUB_ENV" -Encoding ascii -Append

      - name: Sync assets to Gitee release (idempotent replace)
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $api = "https://gitee.com/api/v5/repos/hotpot1993/aa-split"
          $tok = $env:GITEE_ACCESS_TOKEN
          $dir = "$env:TEMP\r2g-$($env:TAG)"
          $files = @(
            @{ name = "app-release.apk"; src = "$dir\app-release.apk" },
            @{ name = "app-arm64-v8a-release.apk"; src = "$dir\app-arm64-v8a-release.apk" },
            @{ name = "app-release.aab"; src = "$dir\app-release.aab" }
          )
          # 1) 找到/创建 Gitee 发行版（tag_name 命中优先）
          $listJson = curl.exe -s "$api/releases?per_page=100&access_token=$tok"
          $list = $listJson | ConvertFrom-Json
          $rid = ($list | Where-Object { $_.tag_name -eq $env:TAG } | Select-Object -First 1).id
          if (-not $rid) {
            $createdJson = curl.exe -s -X POST "$api/releases?access_token=$tok" -d "tag_name=$($env:TAG)" -d "target_commitish=master" -d "name=AA-Split $($env:TAG)" -d "body=AA-Split $($env:TAG) release synced from GitHub Actions"
            $created = $createdJson | ConvertFrom-Json
            $rid = $created.id
            if (-not $rid) { throw "Gitee 发行版创建失败: $createdJson" }
          }
          Write-Host "gitee release id=$rid tag=$($env:TAG)"
          # 2) 按新产物幂等替换附件（同名先删后传，Gitee 中国网络上传顺畅）
          foreach ($f in $files) {
            $name = $f.name
            $attrsJson = curl.exe -s "$api/releases/$rid/attach_files?access_token=$tok"
            $attrs = $attrsJson | ConvertFrom-Json
            foreach ($a in ($attrs | Where-Object { $_.name -eq $name })) {
              curl.exe -s -X DELETE "$api/releases/$rid/attach_files/$($a.id)?access_token=$tok" | Out-Null
              Write-Host "replaced $name (old id=$($a.id))"
            }
            $upJson = curl.exe -s -X POST "$api/releases/$rid/attach_files?access_token=$tok" -F "file=@$($f.src);filename=$name"
            $up = $upJson | ConvertFrom-Json
            if (-not $up.id) { throw "上传失败 $name : $upJson" }
            Write-Host "uploaded $name -> attachment id=$($up.id)"
          }

      - name: Verify latest Gitee download URL
        shell: powershell
        run: |
          $url = "https://gitee.com/hotpot1993/aa-split/releases/download/$env:TAG/app-release.apk"
          $code = (curl.exe -sIL -o NUL -w "%{http_code}" --max-time 60 $url | Select-Object -Last 1)
          Write-Host "check $url -> http=$code"
          if ($code -ne "200" -and $code -ne "302") { throw "Gitee 下载地址不可用: http=$code" }
          Write-Host "Gitee 发行版已同步：$url"
