name: smoke

# 集成冒烟：启动 PostgreSQL/Redis → 构建服务端 → 真库跑全链路 smoke + SSE + 客户端契约
on:
  push:
    branches: [master]
  pull_request:

jobs:
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aa
          POSTGRES_PASSWORD: aa_dev_password
          POSTGRES_DB: aa_split
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U aa -d aa_split"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - "6379:6379"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install / generate / build / e2e
        working-directory: server
        run: |
          npm ci
          npx prisma generate
          npm run build
          npm test
          npm run test:e2e

      - name: Apply migrations + start API
        working-directory: server
        env:
          DATABASE_URL: postgresql://aa:aa_dev_password@localhost:5432/aa_split?schema=public
          JWT_ACCESS_SECRET: ci-access-secret
          JWT_REFRESH_SECRET: ci-refresh-secret
          REDIS_HOST: localhost
          REDIS_PORT: "6379"
          SWAGGER_ENABLED: "false"
        run: |
          npx prisma migrate deploy
          nohup node dist/main.js > /tmp/aa-api.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:3000/api/v1/health && exit 0
            sleep 2
          done
          echo "API 未在 60s 内就绪"; tail -40 /tmp/aa-api.log; exit 1

      - name: API full-chain smoke (22 steps) + SSE
        working-directory: server
        env:
          AA_API_BASE: http://127.0.0.1:3000/api/v1
        run: |
          node ../scripts/smoke-api.mjs
          node ../scripts/sse-check.mjs

      - name: Flutter client contract tests (AA_USE_MOCK=false)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: app
      - run: flutter analyze
        working-directory: app
      - run: flutter test --dart-define=AA_USE_MOCK=false test/api_contract_test.dart
        working-directory: app
