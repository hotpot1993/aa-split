name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  server:
    name: Server (NestJS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npm run build
      - run: npm test
      - run: npm run test:e2e
      - name: Prisma schema check
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
        run: npx prisma validate

  app:
    name: App (Flutter)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.x
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - name: Contract tests (real-API mode)
        run: flutter test --dart-define=AA_USE_MOCK=false test/api_contract_test.dart

  ocr-worker:
    name: OCR Worker (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ocr-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ocr-worker/requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Unit + API tests (engine mocked, no model download)
        run: python -m pytest tests/ -q
