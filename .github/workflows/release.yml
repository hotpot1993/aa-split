name: Release Build

# 打 v* 标签时自动构建安装包并创建 GitHub Release（GitHub 服务器直传附件，不受本地网络影响）
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # 创建 Release / 上传附件所需

jobs:
  build:
    name: Build AAB + APK and publish release
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.x
          channel: stable
          cache: true

      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Configure release signing
        working-directory: .
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEYSTORE_KEY_ALIAS }}
        run: |
          mkdir -p app/android/keystore
          echo "$KEYSTORE_BASE64" | base64 -d > app/android/keystore/release.jks
          cat > app/android/key.properties <<EOF
          storeFile=keystore/release.jks
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          EOF
          test "$(wc -c < app/android/keystore/release.jks)" -gt 1000 || { echo "keystore 解码失败"; exit 1; }

      - run: flutter pub get

      - name: Build AAB
        run: |
          flutter build appbundle --release \
            --dart-define=AA_USE_MOCK=false \
            --dart-define=AA_API_BASE=https://api.hotpot1993.top/api/v1

      - name: Build universal APK
        run: |
          flutter build apk --release \
            --dart-define=AA_USE_MOCK=false \
            --dart-define=AA_API_BASE=https://api.hotpot1993.top/api/v1

      - name: Build per-ABI APKs
        run: |
          flutter build apk --release --split-per-abi \
            --dart-define=AA_USE_MOCK=false \
            --dart-define=AA_API_BASE=https://api.hotpot1993.top/api/v1

      - name: Collect artifacts
        working-directory: .
        run: |
          mkdir -p dist/release
          cp app/build/app/outputs/bundle/release/app-release.aab dist/release/
          cp app/build/app/outputs/flutter-apk/app-release.apk dist/release/
          cp app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/release/
          ls -lh dist/release/

      - name: Verify release signing
        working-directory: .
        run: |
          echo "== 证书指纹(必须与正式 keystore 一致) =="
          APKSIGNER=$(ls "$ANDROID_HOME/build-tools"/*/apksigner 2>/dev/null | tail -1) || true
          [ -n "$APKSIGNER" ] || APKSIGNER=$(command -v apksigner)
          DIGEST=$("$APKSIGNER" verify --print-certs app/build/app/outputs/flutter-apk/app-release.apk | grep "SHA-256 digest" | head -1 | awk '{print $NF}')
          echo "cert SHA-256 digest: $DIGEST"
          echo "$DIGEST" | grep -qi "d2ab2acc2e0f52dd82807a54c8468e8795ae527c922c033531abeb05c07bfa0d" || { echo "!! 签名证书不是正式 keystore(疑似 debug 签名),中止发布"; exit 1; }

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: AA-Split ${{ github.ref_name }}
          body: |
            ## AA-Split ${{ github.ref_name }}

            > 本发行版安装包由 GitHub Actions 使用**正式签名**（store keystore，经 Actions Secrets 注入）构建，签名指纹见构建日志 `Verify release signing` 步骤。

            | 文件 | 说明 |
            |---|---|
            | `app-release.aab` | 商店上架用 App Bundle |
            | `app-release.apk` | 通用 APK（可直接安装） |
            | `app-arm64-v8a-release.apk` | arm64 精简包（现代手机） |

            链接线上 API：`https://api.hotpot1993.top/api/v1`
          files: |
            dist/release/app-release.aab
            dist/release/app-release.apk
            dist/release/app-arm64-v8a-release.apk
