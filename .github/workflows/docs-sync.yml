name: Docs Sync

# 文档自动同步：每次 master 推送后，
#   1) 用服务端实测测试数刷新 README 状态表（npm test 计数，平台无关）
#   2) 同步版本串（pubspec → docs/ui-demo/index.html）
#   3) 重新生成 API 端点清单 docs/api-endpoints.generated.md
# 有变更则以 [docs-sync] 提交推回（GITHUB_TOKEN 推送不会再次触发工作流，无递归）。
# 脚本：scripts/sync-docs.mjs（可在本地手动运行）
# 注意：客户端 flutter 测试数刻意不由 Linux CI 自动刷新——golden 截图校验仅 Windows 运行，
#       Linux 通过数（102）与 Windows 实测（107）不一致；README 客户端计数保持 Windows 实测值。
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: docs-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Regenerate docs from code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Server test count (npm test)
        working-directory: server
        run: |
          npm ci --no-audit --no-fund || npm install --no-audit --no-fund
          npm test 2>&1 | tee /tmp/server-test.log
          COUNT=$(grep -oE 'Tests:[[:space:]]+[0-9]+ passed' /tmp/server-test.log | head -1 | grep -oE '[0-9]+')
          echo "SERVER_TESTS=$COUNT" >> "$GITHUB_ENV"

      - name: Regenerate docs (version / API endpoints / counts)
        run: |
          node scripts/sync-docs.mjs --server-tests="$SERVER_TESTS"

      - name: Commit back if changed
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "::notice::文档与代码一致，无需提交"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs(sync): [docs-sync] 代码变更后自动同步文档（版本串/API 端点清单/服务端测试计数）"
          git push origin master
          echo "::notice::docs-sync 更新已推回仓库"
