name: Release to Gitee

# GitHub 发行版（Release）发布事件 → 自动同步到 Gitee 发行版。
# 采用「release2gitee」（hepengju/release2gitee v1.2.1）在 **VPS（中国侧）中转执行**：
#   - GitHub Actions 负责：触发 + 把 release2gitee CLI 部署到 VPS
#   - VPS 上运行 release2gitee：GitHub↔VPS 下载快（92MB 约 4s），VPS↔Gitee 上传快；
#     规避 GitHub 美国 runner 直连 Gitee 上传被 CLI 硬编码 60s 超时（跨国链路不可达）
#   - 特性：幂等（已存在发行版跳过）、同步最近 5 个发行版、最近 3 个保留附件、
#     body 中 GitHub 下载地址自动替换为 Gitee、进度条
# 规范：更新包文件名 = app-release.apk（AppConfig.giteeUpdateUrl / APP_VERSION_URL 均指向
#       https://gitee.com/hotpot1993/aa-split/releases/download/vX.Y.Z/app-release.apk）
# 凭据：GITEE_ACCESS_TOKEN（Gitee PAT）/ VPS_SSH_KEY + VPS_HOST + VPS_USER（root 免密）
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-gitee
  cancel-in-progress: false

jobs:
  sync:
    name: Sync releases to Gitee (release2gitee @ VPS relay)
    runs-on: ubuntu-latest
    env:
      GITEE_TOKEN: ${{ secrets.GITEE_ACCESS_TOKEN }}
      GITHUB_TOKEN: ${{ github.token }}
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
    steps:
      - name: Install SSH key to VPS relay
        run: |
          mkdir -p "$HOME/.ssh" && chmod 700 "$HOME/.ssh"
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > "$HOME/.ssh/id_vps"
          chmod 600 "$HOME/.ssh/id_vps"
          ssh-keyscan -H "${VPS_HOST}" >> "$HOME/.ssh/known_hosts" 2>/dev/null || true

      - name: Deploy release2gitee CLI to VPS
        env:
          VER: v1.2.1
        run: |
          curl -fsSL -o /tmp/release2gitee.tgz \
            "https://github.com/hepengju/release2gitee/releases/download/${VER}/release2gitee-x86_64-unknown-linux-gnu.tar.gz"
          tar -xzf /tmp/release2gitee.tgz -C /tmp
          scp -i "$HOME/.ssh/id_vps" -o IdentitiesOnly=yes /tmp/release2gitee \
            "${VPS_USER}@${VPS_HOST}:/usr/local/bin/release2gitee"
          ssh -i "$HOME/.ssh/id_vps" -o IdentitiesOnly=yes "${VPS_USER}@${VPS_HOST}" \
            "chmod 755 /usr/local/bin/release2gitee && /usr/local/bin/release2gitee --help | head -3"

      - name: Sync latest GitHub releases to Gitee (via VPS relay)
        run: |
          ssh -i "$HOME/.ssh/id_vps" -o IdentitiesOnly=yes "${VPS_USER}@${VPS_HOST}" \
            "GITHUB_OWNER=hotpot1993 GITHUB_REPO=aa-split GITEE_OWNER=hotpot1993 GITEE_REPO=aa-split GITEE_TOKEN='${GITEE_TOKEN}' GITHUB_TOKEN='${GITHUB_TOKEN}' release2gitee"

      - name: Verify latest Gitee download URL
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(gh release list --repo "$GITHUB_REPOSITORY" --json tagName --jq '.[0].tagName')
          URL="https://gitee.com/hotpot1993/aa-split/releases/download/${TAG}/app-release.apk"
          CODE=$(curl -sIL -o /dev/null -w "%{http_code}" --max-time 60 "$URL" | tail -1)
          echo "check $URL -> http=$CODE"
          [ "$CODE" = "200" ] || [ "$CODE" = "302" ] || { echo "::error::Gitee 下载地址不可用"; exit 1; }
          echo "::notice::Gitee 发行版已同步：$URL"
