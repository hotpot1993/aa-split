name: Release to Gitee

# GitHub 鍙戣鐗堬紙Release锛夊彂甯冧簨浠?鈫?鑷姩鍚屾鍒?Gitee 鍙戣鐗堛€?# 寮曟搸锛歳elease2gitee锛坔epengju/release2gitee v1.2.1锛孯ust CLI锛夛細
#   - 骞傜瓑锛堝凡瀛樺湪鍙戣鐗堣烦杩囷級銆佸悓姝ユ渶杩?5 涓彂琛岀増銆佹渶杩?3 涓繚鐣欓檮浠躲€?#     body 涓?GitHub 涓嬭浇鍦板潃鑷姩鏇挎崲涓?Gitee銆佽繘搴︽潯
# 杩愯浣嶇疆锛?*鑷墭绠?Runner锛坮elay-cn锛?*鈥斺€擥itHub 鎵樼 runner锛堢編鍥斤級涓?VPS锛堢編鍥斤級
#   鐩磋繛 Gitee 闄勪欢涓婁紶浼氳鎷︽埅鎸傝捣锛堝疄娴?60s/300s 瓒呮椂锛況elease2gitee CLI 纭紪鐮?60s 瓒呮椂锛夛紱
#   涓浗缃戠粶鑺傜偣涓婁紶 20MB 浠?~4s銆傛晠鍦ㄦ湰鏈猴紙涓浗缃戠粶锛夋敞鍐?relay-cn 鏍囩鐨勮嚜鎵樼 Runner銆?# 瑙勮寖锛氭洿鏂板寘鏂囦欢鍚?= app-release.apk锛圓ppConfig.giteeUpdateUrl / APP_VERSION_URL 鍧囨寚鍚?#       https://gitee.com/hotpot1993/aa-split/releases/download/vX.Y.Z/app-release.apk锛?# 鍑嵁锛欸ITEE_ACCESS_TOKEN锛圙itee PAT锛? github.token锛圙itHub API 閫熺巼锛?on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-gitee
  cancel-in-progress: false

jobs:
  sync:
    name: Sync releases to Gitee (release2gitee @ CN relay)
    runs-on: [self-hosted, relay-cn]
    env:
      GITEE_ACCESS_TOKEN: ${{ secrets.GITEE_ACCESS_TOKEN }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Install release2gitee CLI (Windows)
        env:
          VER: v1.2.1
        shell: powershell
        run: |
          $zip = "$env:TEMP\release2gitee.zip"
          curl.exe -fsSL -o $zip "https://github.com/hepengju/release2gitee/releases/download/$env:VER/release2gitee-x86_64-pc-windows-msvc.zip"
          $dir = "$env:TEMP\release2gitee"
          if (Test-Path $dir) { Remove-Item $dir -Recurse -Force }
          Expand-Archive -Path $zip -DestinationPath $dir -Force
          & "$dir\release2gitee.exe" --help | Select-Object -First 5

      - name: Sync latest GitHub releases to Gitee
        shell: powershell
        run: |
          $dir = "$env:TEMP\release2gitee"
          $env:GITHUB_OWNER = "hotpot1993"
          $env:GITHUB_REPO = "aa-split"
          $env:GITEE_OWNER = "hotpot1993"
          $env:GITEE_REPO = "aa-split"
          $env:GITEE_TOKEN = $env:GITEE_ACCESS_TOKEN
          & "$dir\release2gitee.exe"
          if ($LASTEXITCODE -ne 0) { throw "release2gitee 鍚屾澶辫触 (exit $LASTEXITCODE)" }

      - name: Verify latest Gitee download URL
        shell: powershell
        run: |
          $rel = curl.exe -s -H "Authorization: Bearer $env:GITHUB_TOKEN" "https://api.github.com/repos/hotpot1993/aa-split/releases/latest" | ConvertFrom-Json
          $url = "https://gitee.com/hotpot1993/aa-split/releases/download/$($rel.tag_name)/app-release.apk"
          $code = (curl.exe -sIL -o NUL -w "%{http_code}" --max-time 60 $url | Select-Object -Last 1)
          Write-Host "check $url -> http=$code"
          if ($code -ne "200" -and $code -ne "302") { throw "Gitee 涓嬭浇鍦板潃涓嶅彲鐢? http=$code" }
          Write-Host "Gitee 鍙戣鐗堝凡鍚屾锛?url"
