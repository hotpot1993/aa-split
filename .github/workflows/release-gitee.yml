name: Release to Gitee

# GitHub 发行版（Release）发布事件 → 自动同步到 Gitee 发行版。
# 使用社区 Action「release2gitee」（hepengju/release2gitee v1.2.1，Rust CLI）：
#   - 幂等：已存在的 Gitee 发行版跳过；可重复执行
#   - 同步最近 N 个 GitHub Release 的附件（原文件名：app-release.aab / app-release.apk / app-arm64-v8a-release.apk）
#   - 仅最新 M 个 Gitee 发行版保留附件（省空间），其余保留元数据 + 2 个源码附件
#   - body 中 github.com 下载地址自动替换为 gitee.com
# 约定：App 更新包的规范文件名 = app-release.apk
#       （AppConfig.giteeUpdateUrl 与 APP_VERSION_URL 均指向
#        https://gitee.com/hotpot1993/aa-split/releases/download/vX.Y.Z/app-release.apk）
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-gitee
  cancel-in-progress: false

jobs:
  sync:
    name: Sync releases to Gitee (release2gitee)
    runs-on: ubuntu-latest
    env:
      # release2gitee 配置（见 https://github.com/hepengju/release2gitee）
      github_owner: hotpot1993
      github_repo: aa-split
      gitee_owner: hotpot1993
      gitee_repo: aa-split
      gitee_token: ${{ secrets.GITEE_ACCESS_TOKEN }}
      github_token: ${{ github.token }}   # 提升 GitHub API 速率 50/h → 3000/h
      release2gitee__github_latest_release_count: '5'
      release2gitee__gitee_retain_release_attach_files_count: '3'
    steps:
      - name: Install release2gitee CLI
        run: |
          VER=v1.2.1
          curl -fsSL -o /tmp/release2gitee.tgz \
            "https://github.com/hepengju/release2gitee/releases/download/${VER}/release2gitee-x86_64-unknown-linux-gnu.tar.gz"
          tar -xzf /tmp/release2gitee.tgz -C /tmp
          install -m 0755 /tmp/release2gitee /usr/local/bin/release2gitee
          release2gitee --help | head -20

      - name: Sync latest GitHub releases to Gitee
        run: release2gitee

      - name: Verify latest Gitee download URL
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(gh release list --repo "$GITHUB_REPOSITORY" --json tagName --jq '.[0].tagName')
          URL="https://gitee.com/hotpot1993/aa-split/releases/download/${TAG}/app-release.apk"
          CODE=$(curl -sIL -o /dev/null -w "%{http_code}" --max-time 60 "$URL" | tail -1)
          echo "check $URL -> http=$CODE"
          [ "$CODE" = "200" ] || [ "$CODE" = "302" ] || { echo "::error::Gitee 下载地址不可用"; exit 1; }
          echo "::notice::Gitee 发行版已同步：$URL"
